<title>Turing World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one control bar on top; below it the world fills the screen as a dot-grid workbench of machine
   chassis wired to paper-tape reels. Editors open as floating windows; guide and console float in corners. */
:root {
  --bg: #e3e8ed; --surface: #f6f8fa; --surface-2: #ffffff; --ink: #17202b; --muted: #586474;
  --line: #c3ccd6; --line-soft: #d9e0e7; --accent: #2a49cf; --accent-soft: #dfe5fb; --accent-ink: #ffffff;
  --ok: #1d7a3a; --ok-soft: #dcf0e2; --bad: #c0302e; --bad-soft: #f8dfde; --warn: #a06200;
  --cell: #fffdf8; --tape: #efe6cf; --tape-edge: #cdbf9c; --hole: #d7c9a6; --reel: #d9cfb6; --reel-hub: #8d826a;
  --chassis: #f2f4f6; --chassis-edge: #b4bfcb; --chassis-hi: #ffffff; --screw: #a3adb9; --shadow: rgba(25, 35, 50, .22);
  --screen: #1c1813; --screen-bezel: #3b342b; --screen-ink: #ffcf7a; --screen-dim: #8c7858; --led-off: #c6ccd3; --jack: #2a2f36;
  --m1: #d4470e; --m2: #23843a; --m3: #6440d6; --m4: #be2459; --m5: #1a73cc; --m6: #8a6700;
  --m1s: #ff8a4f; --m2s: #5ed07a; --m3s: #a68cff; --m4s: #ff6fa5; --m5s: #5cb1ff; --m6s: #e2ba3c;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --cw: 30px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1218; --surface: #151c25; --surface-2: #1b2430; --ink: #e2e8f0; --muted: #93a0b1;
  --line: #2d3948; --line-soft: #222b37; --accent: #8199ff; --accent-soft: #252f52; --accent-ink: #0e131a;
  --ok: #5ccf83; --ok-soft: #173424; --bad: #ff7d7a; --bad-soft: #3d1d1f; --warn: #e3a94b;
  --cell: #262d36; --tape: #2f2c25; --tape-edge: #4f4838; --hole: #1a1915; --reel: #3a352a; --reel-hub: #8d826a;
  --chassis: #1d2530; --chassis-edge: #3a4757; --chassis-hi: #2c3643; --screw: #4c5868; --shadow: rgba(0, 0, 0, .55);
  --screen: #0c0a07; --screen-bezel: #2d281f; --screen-ink: #ffc768; --screen-dim: #7c6a4a; --led-off: #3a434f; --jack: #090c10;
  --m1: #ff8a4f; --m2: #5ed07a; --m3: #a68cff; --m4: #ff6fa5; --m5: #5cb1ff; --m6: #e2ba3c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1218; --surface: #151c25; --surface-2: #1b2430; --ink: #e2e8f0; --muted: #93a0b1;
  --line: #2d3948; --line-soft: #222b37; --accent: #8199ff; --accent-soft: #252f52; --accent-ink: #0e131a;
  --ok: #5ccf83; --ok-soft: #173424; --bad: #ff7d7a; --bad-soft: #3d1d1f; --warn: #e3a94b;
  --cell: #262d36; --tape: #2f2c25; --tape-edge: #4f4838; --hole: #1a1915; --reel: #3a352a; --reel-hub: #8d826a;
  --chassis: #1d2530; --chassis-edge: #3a4757; --chassis-hi: #2c3643; --screw: #4c5868; --shadow: rgba(0, 0, 0, .55);
  --screen: #0c0a07; --screen-bezel: #2d281f; --screen-ink: #ffc768; --screen-dim: #7c6a4a; --led-off: #3a434f; --jack: #090c10;
  --m1: #ff8a4f; --m2: #5ed07a; --m3: #a68cff; --m4: #ff6fa5; --m5: #5cb1ff; --m6: #e2ba3c; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cell.qd { box-shadow: inset 0 0 0 2px var(--accent); }
.cell.sent { background: color-mix(in srgb, var(--mc) 26%, var(--cell)); }
.m1 { --mc: var(--m1); --mcs: var(--m1s); } .m2 { --mc: var(--m2); --mcs: var(--m2s); } .m3 { --mc: var(--m3); --mcs: var(--m3s); }
.m4 { --mc: var(--m4); --mcs: var(--m4s); } .m5 { --mc: var(--m5); --mcs: var(--m5s); } .m6 { --mc: var(--m6); --mcs: var(--m6s); }

.app { height: 100%; display: flex; flex-direction: column; }

/* ---- control bar ---- */
.bar { position: relative; z-index: 300; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-block: 8px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.bar > * { flex-shrink: 0; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 19px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 26px; height: 26px; }
.grp { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.grp.sep { padding-left: 14px; border-left: 1px solid var(--line-soft); }
.grow { flex: 1 1 0; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 5px 11px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); min-width: 70px; justify-content: center; }
.btn.small { padding: 3px 8px; font-size: 12.5px; }
.btn.icon { padding: 5px 7px; } .btn.icon svg { width: 16px; height: 16px; display: block; }
.btn.danger { color: var(--bad); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.speed { display: flex; align-items: center; gap: 6px; }
.speed input { width: 84px; accent-color: var(--accent); }
select.sel { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 4px 6px; max-width: 170px; }
.counter { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 13px; }
.pill { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; border-radius: 99px; padding: 2px 8px; background: var(--line-soft); color: var(--muted); white-space: nowrap; }
.pill.running { background: var(--accent-soft); color: var(--accent); }
.pill.waiting { background: transparent; border: 1px dashed var(--muted); padding: 1px 7px; }
.pill.accept { background: var(--ok-soft); color: var(--ok); }
.pill.reject, .pill.timeout { background: var(--bad-soft); color: var(--bad); }
.menuwrap { position: relative; }
.menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 400; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 14px 34px -12px var(--shadow); padding: 6px; min-width: 260px; display: flex; flex-direction: column; gap: 2px; }
.menu { max-height: calc(100vh - 76px); max-height: calc(100dvh - 76px); overflow-y: auto; overscroll-behavior: contain; }
#mAdd { width: min(720px, calc(100vw - 24px)); }
.addgrid { columns: 3 200px; column-gap: 8px; }
.addgrp { display: flex; flex-direction: column; gap: 1px; min-width: 0; break-inside: avoid; padding-bottom: 6px; }
.addgrp button { padding: 5px 8px; gap: 8px; } .addgrp button > span:last-child { min-width: 0; font-size: 13px; }
.addgrp small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11.5px; }
.addgrp .cls { min-width: 36px; font-size: 10px; }
.wtitle .ib + .ib { margin-left: 0; }
.wtitle .ib.del svg { width: 14px; height: 14px; } .wtitle .ib.del:hover { color: var(--bad); border-color: var(--bad); }
#mWorlds { width: min(660px, calc(100vw - 24px)); }
.wgroups { columns: 2 280px; column-gap: 8px; }
.wgroup { break-inside: avoid; display: flex; flex-direction: column; gap: 2px; padding-bottom: 6px; }
.wgh { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px 9px 2px; }
.menu button { border: 0; background: none; border-radius: 6px; padding: 7px 9px; display: flex; align-items: center; gap: 10px; text-align: left; }
.menu button:hover, .menu button.on { background: var(--accent-soft); }
.menu small { display: block; color: var(--muted); font-size: 12px; }
.menusep { height: 1px; background: var(--line-soft); margin: 4px 2px; }
.iowin { width: 460px; }
.red { position: absolute; z-index: 18; display: flex; align-items: center; gap: 10px; min-width: 210px; max-width: 280px; padding: 8px 12px 8px 8px; background: var(--surface); border: 1.5px solid var(--accent); border-radius: 999px; box-shadow: 0 8px 18px -12px var(--shadow); }
.red.dragging { z-index: 40; }
.redsym { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-family: var(--f-mono); font-size: 16px; font-weight: 700; }
.redtxt { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.redtxt b { font-family: var(--f-mono); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.redtxt span { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.redtxt .redstat { font-weight: 600; }
.red.rs-ok { border-color: var(--ok); } .red.rs-ok .redsym { background: var(--ok); } .red.rs-ok .redstat { color: var(--ok); }
.red.rs-fail, .red.rs-over { border-color: var(--bad); } .red.rs-fail .redsym, .red.rs-over .redsym { background: var(--bad); } .red.rs-fail .redstat, .red.rs-over .redstat { color: var(--bad); }
.wires path.redline { stroke: var(--accent); stroke-width: 2.4; opacity: .85; fill: none; }
.wires path.redvia { stroke: var(--accent); stroke-width: 1.4; stroke-dasharray: 2 4; opacity: .7; fill: none; }
.wires .redhead { fill: var(--accent); }
.redwin { width: 500px; }
.redform { display: flex; align-items: flex-end; gap: 10px; }
.redrel { font-family: var(--f-mono); font-size: 20px; font-weight: 700; color: var(--accent); padding-bottom: 4px; }
.redstep { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 8px; border: 1px solid var(--line-soft); border-radius: 8px; background: var(--surface-2); }
.redstep select { flex: 1 1 140px; width: auto; }
.redstep .ib { margin-left: auto; }
.redidx { font-family: var(--f-mono); font-weight: 700; color: var(--accent); }
code { font-family: var(--f-mono); font-size: .92em; background: var(--line-soft); border-radius: 3px; padding: 0 3px; } textarea.edit.io { min-height: 120px; font-size: 11.5px; }
.cls { font-family: var(--f-mono); font-size: 11px; font-weight: 600; min-width: 40px; text-align: center; padding: 2px 5px; border-radius: 4px; background: var(--ink); color: var(--bg); flex: 0 0 auto; }

/* ---- stage ---- */
.stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
.canvas { position: absolute; inset: 0; overflow: auto; touch-action: pan-x pan-y; background-color: var(--bg);
  background-image: radial-gradient(circle, var(--line) 1px, transparent 1.4px); background-size: 20px 20px; background-attachment: local; }
.sizer { position: relative; }
.timeline { top: 12px; left: max(14px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 4px; padding: 4px 10px 4px 6px; border-radius: 8px; max-width: calc(100% - 260px); }
.timeline .ib { margin: 0; width: 28px; height: 26px; font-size: 11px; }
.timeline .ib:disabled { opacity: .35; cursor: default; }
.timeline input[type=range] { width: 220px; min-width: 60px; flex: 1 1 auto; accent-color: var(--accent); }
.timeline.past { border-color: var(--warn); box-shadow: 0 0 0 1px var(--warn), 0 16px 38px -18px var(--shadow); }
.tl-label { white-space: nowrap; font-size: 12px; min-width: 64px; }
.bpnote { color: var(--bad); font-weight: 600; }
.code div i { cursor: pointer; position: relative; }
.code div i:hover { color: var(--bad); }
.code div.bp i::before, .mcode div.bp i::before { content: ""; position: absolute; left: 3px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: var(--bad); }
.g-node.bp circle, .g-node.bp rect, .g-node.bp polygon { stroke: var(--bad); stroke-width: 3; stroke-dasharray: 4 2; }
.world { position: absolute; left: 0; top: 48px; transform-origin: 0 0; }
.zoom { top: 12px; right: max(14px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 8px; }
.zoom button { border: 0; background: none; border-radius: 5px; min-width: 30px; height: 28px; padding: 0 7px; font-weight: 600; color: var(--ink); }
.zoom button:hover { background: var(--accent-soft); }
.zoom #zoomPct { font-family: var(--f-mono); font-size: 12px; font-weight: 500; min-width: 52px; font-variant-numeric: tabular-nums; }
.zoom .div { width: 1px; height: 18px; background: var(--line-soft); margin: 0 2px; }
.layer { position: absolute; inset: 0; pointer-events: none; z-index: 100; }
.layer > * { pointer-events: auto; }
.wires { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 15; }
.wires path { fill: none; stroke: var(--mc); stroke-width: 3; stroke-linecap: round; opacity: .55; }
.wires path.core { stroke: var(--chassis-hi); stroke-width: 1; opacity: .5; }
.wires path.on { stroke-width: 4; opacity: 1; }
.wires path.wait { stroke-dasharray: 6 5; opacity: .85; }
.wires circle { fill: var(--jack); stroke: var(--mc); stroke-width: 2; }
.drag { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.dragging { cursor: grabbing; }

/* ---- machine chassis ---- */
.mach { position: absolute; width: 280px; background: linear-gradient(180deg, var(--chassis-hi), var(--chassis) 26px); border: 1px solid var(--chassis-edge); border-top: 5px solid var(--mc);
  border-radius: 12px; padding: 8px 12px 0; box-shadow: 0 1px 0 var(--chassis-hi) inset, 0 10px 22px -14px var(--shadow), 0 2px 4px -2px var(--shadow); z-index: 20; }
.mach.compact { width: 240px; }
.mach::before { content: ""; position: absolute; inset: 5px; pointer-events: none; border-radius: 8px;
  background: radial-gradient(circle at 0 0, var(--screw) 0 2px, transparent 2.6px) top left / 6px 6px no-repeat,
    radial-gradient(circle at 100% 0, var(--screw) 0 2px, transparent 2.6px) top right / 6px 6px no-repeat,
    radial-gradient(circle at 0 100%, var(--screw) 0 2px, transparent 2.6px) bottom left / 6px 6px no-repeat,
    radial-gradient(circle at 100% 100%, var(--screw) 0 2px, transparent 2.6px) bottom right / 6px 6px no-repeat; }
.mach.sel { outline: 2px solid var(--accent); outline-offset: 3px; }
.mach.top { box-shadow: 0 0 0 1px var(--mc), 0 0 22px -4px var(--mc), 0 10px 22px -14px var(--shadow); }
.mach.dragging { box-shadow: 0 22px 36px -16px var(--shadow); z-index: 40; }
.plate { display: flex; align-items: center; gap: 7px; min-width: 0; }
.plate b { font-family: var(--f-mono); font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.kind { font-size: 9.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; white-space: nowrap; }
.tgt { font-size: 9.5px; font-weight: 700; letter-spacing: .06em; color: var(--accent-ink); background: var(--accent); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.ib { margin-left: auto; border: 1px solid var(--line); background: var(--surface-2); border-radius: 5px; width: 24px; height: 22px; display: grid; place-items: center; padding: 0; color: var(--muted); flex: 0 0 auto; }
.ib:hover { color: var(--ink); border-color: var(--muted); }
.ib svg { width: 14px; height: 14px; }
.led { width: 11px; height: 11px; border-radius: 50%; background: var(--led-off); box-shadow: inset 0 -1px 2px rgba(0,0,0,.25); flex: 0 0 auto; }
.led.running { background: var(--mcs); box-shadow: 0 0 8px var(--mcs), inset 0 -1px 2px rgba(0,0,0,.2); }
.led.waiting { background: var(--warn); animation: blink 1s steps(2) infinite; }
.led.unclear { background: var(--warn); box-shadow: 0 0 7px var(--warn); }
.led.accept { background: var(--ok); box-shadow: 0 0 7px var(--ok); }
.led.reject, .led.timeout { background: var(--bad); box-shadow: 0 0 7px var(--bad); }
@keyframes blink { 50% { opacity: .35; } }
.merr { color: var(--bad); font-size: 12px; margin-top: 6px; }
.screen { margin-top: 8px; height: 156px; background: var(--screen); border: 3px solid var(--screen-bezel); border-radius: 7px; overflow: hidden; position: relative;
  box-shadow: inset 0 0 18px rgba(0,0,0,.6); }
.screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px); }
.screen > svg { width: 100%; height: 100%; display: block; }
.screen .g-node circle, .screen .g-node rect, .screen .g-node polygon { fill: none; stroke: var(--screen-dim); stroke-width: 1.6; }
.screen .g-node text { fill: var(--screen-ink); }
.screen .g-node .acc2 { stroke: var(--screen-dim); }
.screen .g-edge path, .screen .g-start { stroke: var(--screen-dim); }
.screen .g-edge text { display: none; }
.screen .ah { fill: var(--screen-dim); } .screen .ah-on { fill: var(--mcs); }
.screen .g-node.on circle, .screen .g-node.on rect, .screen .g-node.on polygon { fill: var(--mcs); stroke: var(--mcs); }
.screen .g-node.on text { fill: var(--screen); }
.screen .g-node.on .acc2 { stroke: var(--screen); }
.screen .g-edge.on path { stroke: var(--mcs); } .screen .g-edge.on text { fill: var(--mcs); }
.mcode { height: 100%; overflow: hidden; font-family: var(--f-mono); font-size: 10.5px; line-height: 1.5; color: var(--screen-ink); padding: 4px 0; }
.mcode div { white-space: pre; display: flex; padding-right: 6px; }
.mcode div i { font-style: normal; color: var(--screen-dim); width: 2.6em; text-align: right; padding-right: 8px; flex: 0 0 auto; }
.mcode div.on { background: var(--mcs); color: var(--screen); } .mcode div.on i { color: var(--screen); }
.mcode .kw { font-weight: 600; } .mcode .cm { color: var(--screen-dim); }
.mcode .str { font-style: italic; } .code .str { color: var(--ok, #2f7d4f); }
.mcode .guesthd { display: block; white-space: normal; font-size: 9.5px; color: var(--screen-dim); padding: 0 8px 3px; border-bottom: 1px dashed var(--screen-dim); margin-bottom: 3px; }
.mcode.guestcode div[data-line] { font-style: italic; }
.readout { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); margin-top: 7px; min-height: 17px; overflow-wrap: anywhere; }
.readout em { font-style: normal; color: var(--ink); font-weight: 600; }
.gauges { display: grid; grid-template-columns: auto 1fr auto; gap: 1px 8px; align-items: center; font-size: 10.5px; color: var(--muted); margin-top: 5px; font-variant-numeric: tabular-nums; font-family: var(--f-mono); }
.meter { height: 5px; background: var(--line-soft); border-radius: 3px; overflow: hidden; box-shadow: inset 0 1px 1px rgba(0,0,0,.12); }
.meter i { display: block; height: 100%; background: var(--mc); }
.meter.over i { background: var(--bad); }
.jacks { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 9px -12px 0; padding: 7px 12px 8px; border-top: 1px solid var(--chassis-edge); background: rgba(0,0,0,.035); border-radius: 0 0 11px 11px; }
.jack { display: flex; align-items: center; gap: 5px; font-family: var(--f-mono); font-size: 11px; }
.jack i { width: 13px; height: 13px; border-radius: 50%; background: radial-gradient(circle, var(--jack) 0 3px, var(--chassis-edge) 3.6px); border: 2px solid var(--mc); flex: 0 0 auto; }
.jack.none i { border-color: var(--bad); border-style: dashed; }
.jack .mod { font-size: 9.5px; color: var(--muted); }
.jack .to { color: var(--muted); }

/* ---- tape reels ---- */
.tape { position: absolute; display: flex; align-items: flex-start; gap: 0; z-index: 10; }
.tape.dragging { z-index: 40; }
.reel { width: 56px; height: 56px; flex: 0 0 56px; margin-top: 12px; margin-right: -6px; position: relative; z-index: 2; }
.reel svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 4px 6px var(--shadow)); }

.circbox svg { display: block; margin: 0 auto; }
.treewin { width: 480px; }
.stwin { width: 520px; }
