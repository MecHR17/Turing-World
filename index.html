<title>Turing World</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: one control bar on top; below it the world fills the screen as a dot-grid workbench of machine
   chassis wired to paper-tape reels. Editors open as floating windows; guide and console float in corners. */
  :root {
    --bg: #e3e8ed;
    --surface: #f6f8fa;
    --surface-2: #ffffff;
    --ink: #17202b;
    --muted: #586474;
    --line: #c3ccd6;
    --line-soft: #d9e0e7;
    --accent: #2a49cf;
    --accent-soft: #dfe5fb;
    --accent-ink: #ffffff;
    --ok: #1d7a3a;
    --ok-soft: #dcf0e2;
    --bad: #c0302e;
    --bad-soft: #f8dfde;
    --warn: #a06200;
    --cell: #fffdf8;
    --tape: #efe6cf;
    --tape-edge: #cdbf9c;
    --hole: #d7c9a6;
    --reel: #d9cfb6;
    --reel-hub: #8d826a;
    --chassis: #f2f4f6;
    --chassis-edge: #b4bfcb;
    --chassis-hi: #ffffff;
    --screw: #a3adb9;
    --shadow: rgba(25, 35, 50, .22);
    --screen: #1c1813;
    --screen-bezel: #3b342b;
    --screen-ink: #ffcf7a;
    --screen-dim: #8c7858;
    --led-off: #c6ccd3;
    --jack: #2a2f36;
    --m1: #d4470e;
    --m2: #23843a;
    --m3: #6440d6;
    --m4: #be2459;
    --m5: #1a73cc;
    --m6: #8a6700;
    --m1s: #ff8a4f;
    --m2s: #5ed07a;
    --m3s: #a68cff;
    --m4s: #ff6fa5;
    --m5s: #5cb1ff;
    --m6s: #e2ba3c;
    --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
    --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --cw: 30px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1218;
      --surface: #151c25;
      --surface-2: #1b2430;
      --ink: #e2e8f0;
      --muted: #93a0b1;
      --line: #2d3948;
      --line-soft: #222b37;
      --accent: #8199ff;
      --accent-soft: #252f52;
      --accent-ink: #0e131a;
      --ok: #5ccf83;
      --ok-soft: #173424;
      --bad: #ff7d7a;
      --bad-soft: #3d1d1f;
      --warn: #e3a94b;
      --cell: #262d36;
      --tape: #2f2c25;
      --tape-edge: #4f4838;
      --hole: #1a1915;
      --reel: #3a352a;
      --reel-hub: #8d826a;
      --chassis: #1d2530;
      --chassis-edge: #3a4757;
      --chassis-hi: #2c3643;
      --screw: #4c5868;
      --shadow: rgba(0, 0, 0, .55);
      --screen: #0c0a07;
      --screen-bezel: #2d281f;
      --screen-ink: #ffc768;
      --screen-dim: #7c6a4a;
      --led-off: #3a434f;
      --jack: #090c10;
      --m1: #ff8a4f;
      --m2: #5ed07a;
      --m3: #a68cff;
      --m4: #ff6fa5;
      --m5: #5cb1ff;
      --m6: #e2ba3c;
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0d1218;
    --surface: #151c25;
    --surface-2: #1b2430;
    --ink: #e2e8f0;
    --muted: #93a0b1;
    --line: #2d3948;
    --line-soft: #222b37;
    --accent: #8199ff;
    --accent-soft: #252f52;
    --accent-ink: #0e131a;
    --ok: #5ccf83;
    --ok-soft: #173424;
    --bad: #ff7d7a;
    --bad-soft: #3d1d1f;
    --warn: #e3a94b;
    --cell: #262d36;
    --tape: #2f2c25;
    --tape-edge: #4f4838;
    --hole: #1a1915;
    --reel: #3a352a;
    --reel-hub: #8d826a;
    --chassis: #1d2530;
    --chassis-edge: #3a4757;
    --chassis-hi: #2c3643;
    --screw: #4c5868;
    --shadow: rgba(0, 0, 0, .55);
    --screen: #0c0a07;
    --screen-bezel: #2d281f;
    --screen-ink: #ffc768;
    --screen-dim: #7c6a4a;
    --led-off: #3a434f;
    --jack: #090c10;
    --m1: #ff8a4f;
    --m2: #5ed07a;
    --m3: #a68cff;
    --m4: #ff6fa5;
    --m5: #5cb1ff;
    --m6: #e2ba3c;
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }

  [hidden] {
    display: none !important;
  }

  html,
  body {
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--f-body);
    font-size: 14px;
    line-height: 1.45;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--surface);
  }

  button,
  select,
  input,
  textarea {
    font: inherit;
    color: inherit;
  }

  button {
    cursor: pointer;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .cell.qd {
    box-shadow: inset 0 0 0 2px var(--accent);
  }

  .cell.sent {
    background: color-mix(in srgb, var(--mc) 26%, var(--cell));
  }

  .m1 {
    --mc: var(--m1);
    --mcs: var(--m1s);
  }

  .m2 {
    --mc: var(--m2);
    --mcs: var(--m2s);
  }

  .m3 {
    --mc: var(--m3);
    --mcs: var(--m3s);
  }

  .m4 {
    --mc: var(--m4);
    --mcs: var(--m4s);
  }

  .m5 {
    --mc: var(--m5);
    --mcs: var(--m5s);
  }

  .m6 {
    --mc: var(--m6);
    --mcs: var(--m6s);
  }

  .app {
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  /* ---- control bar ---- */
  .bar {
    position: relative;
    z-index: 300;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding-left: max(14px, env(safe-area-inset-left, 0px));
    padding-right: max(14px, env(safe-area-inset-right, 0px));
    padding-block: 8px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
  }

  .bar>* {
    flex-shrink: 0;
  }

  .brand {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 19px;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand svg {
    width: 26px;
    height: 26px;
  }

  .grp {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }

  .grp.sep {
    padding-left: 14px;
    border-left: 1px solid var(--line-soft);
  }

  .grow {
    flex: 1 1 0;
  }

  .btn {
    border: 1px solid var(--line);
    background: var(--surface-2);
    border-radius: 6px;
    padding: 5px 11px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .btn:hover {
    border-color: var(--muted);
  }

  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    min-width: 70px;
    justify-content: center;
  }

  .btn.small {
    padding: 3px 8px;
    font-size: 12.5px;
  }

  .btn.icon {
    padding: 5px 7px;
  }

  .btn.icon svg {
    width: 16px;
    height: 16px;
    display: block;
  }

  .btn.danger {
    color: var(--bad);
  }

  .btn.on {
    background: var(--accent-soft);
    border-color: var(--accent);
  }

  .btn:disabled {
    opacity: .45;
    cursor: default;
  }

  .lbl {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--muted);
    font-weight: 600;
  }

  .speed {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .speed input {
    width: 84px;
    accent-color: var(--accent);
  }

  select.sel {
    border: 1px solid var(--line);
    background: var(--surface-2);
    border-radius: 6px;
    padding: 4px 6px;
    max-width: 170px;
  }

  .counter {
    font-family: var(--f-mono);
    font-variant-numeric: tabular-nums;
    font-size: 13px;
  }

  .pill {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    border-radius: 99px;
    padding: 2px 8px;
    background: var(--line-soft);
    color: var(--muted);
    white-space: nowrap;
  }

  .pill.running {
    background: var(--accent-soft);
    color: var(--accent);
  }

  .pill.waiting {
    background: transparent;
    border: 1px dashed var(--muted);
    padding: 1px 7px;
  }

  .pill.accept {
    background: var(--ok-soft);
    color: var(--ok);
  }

  .pill.reject,
  .pill.timeout {
    background: var(--bad-soft);
    color: var(--bad);
  }

  .menuwrap {
    position: relative;
  }

  .menu {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 400;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 14px 34px -12px var(--shadow);
    padding: 6px;
    min-width: 260px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .menu {
    max-height: calc(100vh - 76px);
    max-height: calc(100dvh - 76px);
    overflow-y: auto;
    overscroll-behavior: contain;
  }

  #mAdd {
    width: min(720px, calc(100vw - 24px));
  }

  .addgrid {
    columns: 3 200px;
    column-gap: 8px;
  }

  .addgrp {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
    break-inside: avoid;
    padding-bottom: 6px;
  }

  .addgrp button {
    padding: 5px 8px;
    gap: 8px;
  }

  .addgrp button>span:last-child {
    min-width: 0;
    font-size: 13px;
  }

  .addgrp small {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 11.5px;
  }

  .addgrp .cls {
    min-width: 36px;
    font-size: 10px;
  }

  .wtitle .ib+.ib {
    margin-left: 0;
  }

  .wtitle .ib.del svg {
    width: 14px;
    height: 14px;
  }

  .wtitle .ib.del:hover {
    color: var(--bad);
    border-color: var(--bad);
  }

  #mWorlds {
    width: min(660px, calc(100vw - 24px));
  }

  .wgroups {
    columns: 2 280px;
    column-gap: 8px;
  }

  .wgroup {
    break-inside: avoid;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding-bottom: 6px;
  }

  .wgh {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 6px 9px 2px;
  }

  .menu button {
    border: 0;
    background: none;
    border-radius: 6px;
    padding: 7px 9px;
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
  }

  .menu button:hover,
  .menu button.on {
    background: var(--accent-soft);
  }

  .menu small {
    display: block;
    color: var(--muted);
    font-size: 12px;
  }

  .menusep {
    height: 1px;
    background: var(--line-soft);
    margin: 4px 2px;
  }

  .iowin {
    width: 460px;
  }

  .red {
    position: absolute;
    z-index: 18;
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 210px;
    max-width: 280px;
    padding: 8px 12px 8px 8px;
    background: var(--surface);
    border: 1.5px solid var(--accent);
    border-radius: 999px;
    box-shadow: 0 8px 18px -12px var(--shadow);
  }

  .red.dragging {
    z-index: 40;
  }

  .redsym {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: var(--f-mono);
    font-size: 16px;
    font-weight: 700;
  }

  .redtxt {
    display: flex;
    flex-direction: column;
    min-width: 0;
    line-height: 1.3;
  }

  .redtxt b {
    font-family: var(--f-mono);
    font-size: 12.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .redtxt span {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .redtxt .redstat {
    font-weight: 600;
  }

  .red.rs-ok {
    border-color: var(--ok);
  }

  .red.rs-ok .redsym {
    background: var(--ok);
  }

  .red.rs-ok .redstat {
    color: var(--ok);
  }

  .red.rs-fail,
  .red.rs-over {
    border-color: var(--bad);
  }

  .red.rs-fail .redsym,
  .red.rs-over .redsym {
    background: var(--bad);
  }

  .red.rs-fail .redstat,
  .red.rs-over .redstat {
    color: var(--bad);
  }

  .wires path.redline {
    stroke: var(--accent);
    stroke-width: 2.4;
    opacity: .85;
    fill: none;
  }

  .wires path.redvia {
    stroke: var(--accent);
    stroke-width: 1.4;
    stroke-dasharray: 2 4;
    opacity: .7;
    fill: none;
  }

  .wires .redhead {
    fill: var(--accent);
  }

  .redwin {
    width: 500px;
  }

  .redform {
    display: flex;
    align-items: flex-end;
    gap: 10px;
  }

  .redrel {
    font-family: var(--f-mono);
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    padding-bottom: 4px;
  }

  .redstep {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    background: var(--surface-2);
  }

  .redstep select {
    flex: 1 1 140px;
    width: auto;
  }

  .redstep .ib {
    margin-left: auto;
  }

  .redidx {
    font-family: var(--f-mono);
    font-weight: 700;
    color: var(--accent);
  }

  code {
    font-family: var(--f-mono);
    font-size: .92em;
    background: var(--line-soft);
    border-radius: 3px;
    padding: 0 3px;
  }

  textarea.edit.io {
    min-height: 120px;
    font-size: 11.5px;
  }

  .cls {
    font-family: var(--f-mono);
    font-size: 11px;
    font-weight: 600;
    min-width: 40px;
    text-align: center;
    padding: 2px 5px;
    border-radius: 4px;
    background: var(--ink);
    color: var(--bg);
    flex: 0 0 auto;
  }

  /* ---- stage ---- */
  .stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
  }

  .canvas {
    position: absolute;
    inset: 0;
    overflow: auto;
    touch-action: pan-x pan-y;
    background-color: var(--bg);
    background-image: radial-gradient(circle, var(--line) 1px, transparent 1.4px);
    background-size: 20px 20px;
    background-attachment: local;
  }

  .sizer {
    position: relative;
  }

  .timeline {
    top: 12px;
    left: max(14px, env(safe-area-inset-left, 0px));
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px 4px 6px;
    border-radius: 8px;
    max-width: calc(100% - 260px);
  }

  .timeline .ib {
    margin: 0;
    width: 28px;
    height: 26px;
    font-size: 11px;
  }

  .timeline .ib:disabled {
    opacity: .35;
    cursor: default;
  }

  .timeline input[type=range] {
    width: 220px;
    min-width: 60px;
    flex: 1 1 auto;
    accent-color: var(--accent);
  }

  .timeline.past {
    border-color: var(--warn);
    box-shadow: 0 0 0 1px var(--warn), 0 16px 38px -18px var(--shadow);
  }

  .tl-label {
    white-space: nowrap;
    font-size: 12px;
    min-width: 64px;
  }

  .bpnote {
    color: var(--bad);
    font-weight: 600;
  }

  .code div i {
    cursor: pointer;
    position: relative;
  }

  .code div i:hover {
    color: var(--bad);
  }

  .code div.bp i::before,
  .mcode div.bp i::before {
    content: "";
    position: absolute;
    left: 3px;
    top: 50%;
    width: 8px;
    height: 8px;
    margin-top: -4px;
    border-radius: 50%;
    background: var(--bad);
  }

  .g-node.bp circle,
  .g-node.bp rect,
  .g-node.bp polygon {
    stroke: var(--bad);
    stroke-width: 3;
    stroke-dasharray: 4 2;
  }

  .world {
    position: absolute;
    left: 0;
    top: 48px;
    transform-origin: 0 0;
  }

  .zoom {
    top: 12px;
    right: max(14px, env(safe-area-inset-right, 0px));
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 3px;
    border-radius: 8px;
  }

  .zoom button {
    border: 0;
    background: none;
    border-radius: 5px;
    min-width: 30px;
    height: 28px;
    padding: 0 7px;
    font-weight: 600;
    color: var(--ink);
  }

  .zoom button:hover {
    background: var(--accent-soft);
  }

  .zoom #zoomPct {
    font-family: var(--f-mono);
    font-size: 12px;
    font-weight: 500;
    min-width: 52px;
    font-variant-numeric: tabular-nums;
  }

  .zoom .div {
    width: 1px;
    height: 18px;
    background: var(--line-soft);
    margin: 0 2px;
  }

  .layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 100;
  }

  .layer>* {
    pointer-events: auto;
  }

  .wires {
    position: absolute;
    left: 0;
    top: 0;
    pointer-events: none;
    overflow: visible;
    z-index: 15;
  }

  .wires path {
    fill: none;
    stroke: var(--mc);
    stroke-width: 3;
    stroke-linecap: round;
    opacity: .55;
  }

  .wires path.core {
    stroke: var(--chassis-hi);
    stroke-width: 1;
    opacity: .5;
  }

  .wires path.on {
    stroke-width: 4;
    opacity: 1;
  }

  .wires path.wait {
    stroke-dasharray: 6 5;
    opacity: .85;
  }

  .wires circle {
    fill: var(--jack);
    stroke: var(--mc);
    stroke-width: 2;
  }

  .drag {
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .dragging {
    cursor: grabbing;
  }

  /* ---- machine chassis ---- */
  .mach {
    position: absolute;
    width: 280px;
    background: linear-gradient(180deg, var(--chassis-hi), var(--chassis) 26px);
    border: 1px solid var(--chassis-edge);
    border-top: 5px solid var(--mc);
    border-radius: 12px;
    padding: 8px 12px 0;
    box-shadow: 0 1px 0 var(--chassis-hi) inset, 0 10px 22px -14px var(--shadow), 0 2px 4px -2px var(--shadow);
    z-index: 20;
  }

  .mach.compact {
    width: 240px;
  }

  .mach::before {
    content: "";
    position: absolute;
    inset: 5px;
    pointer-events: none;
    border-radius: 8px;
    background: radial-gradient(circle at 0 0, var(--screw) 0 2px, transparent 2.6px) top left / 6px 6px no-repeat,
      radial-gradient(circle at 100% 0, var(--screw) 0 2px, transparent 2.6px) top right / 6px 6px no-repeat,
      radial-gradient(circle at 0 100%, var(--screw) 0 2px, transparent 2.6px) bottom left / 6px 6px no-repeat,
      radial-gradient(circle at 100% 100%, var(--screw) 0 2px, transparent 2.6px) bottom right / 6px 6px no-repeat;
  }

  .mach.sel {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .mach.top {
    box-shadow: 0 0 0 1px var(--mc), 0 0 22px -4px var(--mc), 0 10px 22px -14px var(--shadow);
  }

  .mach.dragging {
    box-shadow: 0 22px 36px -16px var(--shadow);
    z-index: 40;
  }

  .plate {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
  }

  .plate b {
    font-family: var(--f-mono);
    font-weight: 600;
    font-size: 13.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }

  .kind {
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0 4px;
    white-space: nowrap;
  }

  .tgt {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: .06em;
    color: var(--accent-ink);
    background: var(--accent);
    border-radius: 4px;
    padding: 0 5px;
    white-space: nowrap;
  }

  .ib {
    margin-left: auto;
    border: 1px solid var(--line);
    background: var(--surface-2);
    border-radius: 5px;
    width: 24px;
    height: 22px;
    display: grid;
    place-items: center;
    padding: 0;
    color: var(--muted);
    flex: 0 0 auto;
  }

  .ib:hover {
    color: var(--ink);
    border-color: var(--muted);
  }

  .ib svg {
    width: 14px;
    height: 14px;
  }

  .led {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--led-off);
    box-shadow: inset 0 -1px 2px rgba(0, 0, 0, .25);
    flex: 0 0 auto;
  }

  .led.running {
    background: var(--mcs);
    box-shadow: 0 0 8px var(--mcs), inset 0 -1px 2px rgba(0, 0, 0, .2);
  }

  .led.waiting {
    background: var(--warn);
    animation: blink 1s steps(2) infinite;
  }

  .led.accept {
    background: var(--ok);
    box-shadow: 0 0 7px var(--ok);
  }

  .led.reject,
  .led.timeout {
    background: var(--bad);
    box-shadow: 0 0 7px var(--bad);
  }

  @keyframes blink {
    50% {
      opacity: .35;
    }
  }

  .merr {
    color: var(--bad);
    font-size: 12px;
    margin-top: 6px;
  }

  .screen {
    margin-top: 8px;
    height: 156px;
    background: var(--screen);
    border: 3px solid var(--screen-bezel);
    border-radius: 7px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 0 18px rgba(0, 0, 0, .6);
  }

  .screen::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .035) 0 1px, transparent 1px 3px);
  }

  .screen>svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .screen .g-node circle,
  .screen .g-node rect,
  .screen .g-node polygon {
    fill: none;
    stroke: var(--screen-dim);
    stroke-width: 1.6;
  }

  .screen .g-node text {
    fill: var(--screen-ink);
  }

  .screen .g-node .acc2 {
    stroke: var(--screen-dim);
  }

  .screen .g-edge path,
  .screen .g-start {
    stroke: var(--screen-dim);
  }

  .screen .g-edge text {
    display: none;
  }

  .screen .ah {
    fill: var(--screen-dim);
  }

  .screen .ah-on {
    fill: var(--mcs);
  }

  .screen .g-node.on circle,
  .screen .g-node.on rect,
  .screen .g-node.on polygon {
    fill: var(--mcs);
    stroke: var(--mcs);
  }

  .screen .g-node.on text {
    fill: var(--screen);
  }

  .screen .g-node.on .acc2 {
    stroke: var(--screen);
  }

  .screen .g-edge.on path {
    stroke: var(--mcs);
  }

  .screen .g-edge.on text {
    fill: var(--mcs);
  }

  .mcode {
    height: 100%;
    overflow: hidden;
    font-family: var(--f-mono);
    font-size: 10.5px;
    line-height: 1.5;
    color: var(--screen-ink);
    padding: 4px 0;
  }

  .mcode div {
    white-space: pre;
    display: flex;
    padding-right: 6px;
  }

  .mcode div i {
    font-style: normal;
    color: var(--screen-dim);
    width: 2.6em;
    text-align: right;
    padding-right: 8px;
    flex: 0 0 auto;
  }

  .mcode div.on {
    background: var(--mcs);
    color: var(--screen);
  }

  .mcode div.on i {
    color: var(--screen);
  }

  .mcode .kw {
    font-weight: 600;
  }

  .mcode .cm {
    color: var(--screen-dim);
  }

  .mcode .str {
    font-style: italic;
  }

  .code .str {
    color: var(--ok, #2f7d4f);
  }

  .mcode .guesthd {
    display: block;
    white-space: normal;
    font-size: 9.5px;
    color: var(--screen-dim);
    padding: 0 8px 3px;
    border-bottom: 1px dashed var(--screen-dim);
    margin-bottom: 3px;
  }

  .mcode.guestcode div[data-line] {
    font-style: italic;
  }

  .readout {
    font-family: var(--f-mono);
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 7px;
    min-height: 17px;
    overflow-wrap: anywhere;
  }

  .readout em {
    font-style: normal;
    color: var(--ink);
    font-weight: 600;
  }

  .gauges {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 1px 8px;
    align-items: center;
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 5px;
    font-variant-numeric: tabular-nums;
    font-family: var(--f-mono);
  }

  .meter {
    height: 5px;
    background: var(--line-soft);
    border-radius: 3px;
    overflow: hidden;
    box-shadow: inset 0 1px 1px rgba(0, 0, 0, .12);
  }

  .meter i {
    display: block;
    height: 100%;
    background: var(--mc);
  }

  .meter.over i {
    background: var(--bad);
  }

  .jacks {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    margin: 9px -12px 0;
    padding: 7px 12px 8px;
    border-top: 1px solid var(--chassis-edge);
    background: rgba(0, 0, 0, .035);
    border-radius: 0 0 11px 11px;
  }

  .jack {
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: var(--f-mono);
    font-size: 11px;
  }

  .jack i {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--jack) 0 3px, var(--chassis-edge) 3.6px);
    border: 2px solid var(--mc);
    flex: 0 0 auto;
  }

  .jack.none i {
    border-color: var(--bad);
    border-style: dashed;
  }

  .jack .mod {
    font-size: 9.5px;
    color: var(--muted);
  }

  .jack .to {
    color: var(--muted);
  }

  /* ---- tape reels ---- */
  .tape {
    position: absolute;
    display: flex;
    align-items: flex-start;
    gap: 0;
    z-index: 10;
  }

  .tape.dragging {
    z-index: 40;
  }

  .reel {
    width: 56px;
    height: 56px;
    flex: 0 0 56px;
    margin-top: 12px;
    margin-right: -6px;
    position: relative;
    z-index: 2;
  }

  .reel svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 4px 6px var(--shadow));
  }

  .reel .rim {
    fill: var(--reel);
    stroke: var(--tape-edge);
    stroke-width: 1.5;
  }

  .reel .wind {
    fill: none;
    stroke: var(--tape-edge);
    stroke-width: 1;
    opacity: .7;
  }

  .reel .hub {
    fill: var(--reel-hub);
  }

  .reel .spokes {
    transition: transform .25s ease;
    transform-origin: 28px 28px;
  }

  .reel .spokes path {
    fill: var(--surface-2);
    opacity: .9;
  }

  .tape.random .rim {
    fill: var(--accent-soft);
  }

  .tape.cert .rim {
    fill: var(--ok-soft);
  }

  .tbody {
    flex: 1 1 auto;
    min-width: 0;
  }

  .tlabel {
    display: flex;
    align-items: baseline;
    gap: 7px;
    padding: 0 0 3px 12px;
    white-space: nowrap;
    overflow: hidden;
  }

  .tlabel b {
    font-family: var(--f-mono);
    font-weight: 600;
    font-size: 13px;
  }

  .tlabel .meta {
    font-size: 11px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tscroll {
    overflow-x: auto;
    scrollbar-width: thin;
    padding-bottom: 2px;
    border-radius: 3px;
  }

  .tape.sel .tscroll {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .strip {
    position: relative;
    display: inline-block;
    min-width: 100%;
  }

  .sprocket {
    height: 9px;
    background: var(--tape);
    border: 1px solid var(--tape-edge);
    border-bottom: 0;
    background-image: radial-gradient(circle at center, var(--hole) 0 2.2px, transparent 2.6px);
    background-size: var(--cw) 9px;
  }

  .cells {
    display: flex;
    background: var(--tape);
    border: 1px solid var(--tape-edge);
    border-top: 0;
    padding: 0 0 4px;
    box-shadow: 0 6px 10px -8px var(--shadow);
  }

  .cell {
    flex: 0 0 var(--cw);
    width: var(--cw);
    height: 30px;
    display: grid;
    place-items: center;
    font-family: var(--f-mono);
    font-weight: 600;
    font-size: 15px;
    background: var(--cell);
    border-right: 1px solid var(--tape-edge);
    position: relative;
    color: var(--ink);
  }

  .cell:first-child {
    border-left: 1px solid var(--tape-edge);
  }

  .cell.blank {
    color: transparent;
  }

  .cell.unk {
    color: var(--muted);
    font-weight: 400;
  }

  .cell.origin {
    box-shadow: inset 2px 0 0 var(--accent);
  }

  .cell.w {
    background: var(--accent-soft);
  }

  .cell .ix {
    position: absolute;
    top: 0;
    left: 2px;
    font-size: 8px;
    font-weight: 400;
    color: var(--muted);
    line-height: 1;
  }

  .heads {
    position: relative;
    height: 22px;
  }

  .head {
    position: absolute;
    top: 0;
    width: var(--cw);
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: left .12s ease;
  }

  .head::before {
    content: "";
    width: 0;
    height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-bottom: 7px solid var(--mc);
  }

  .head span {
    font-family: var(--f-mono);
    font-size: 9.5px;
    font-weight: 600;
    color: var(--mc);
    line-height: 1.2;
    white-space: nowrap;
  }

  .head.ghost {
    opacity: .4;
  }

  .head.top span {
    background: var(--mc);
    color: var(--surface-2);
    border-radius: 3px;
    padding: 0 3px;
  }

  /* stack: a well closed at the bottom, open at the top; only the top plate is reachable */
  .tape.stack {
    width: auto;
    flex-direction: column;
  }

  .tape.stack .tlabel {
    padding-left: 2px;
    max-width: 180px;
  }

  .stackcol {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .reel.mouth {
    width: 132px;
    margin-left: 0 !important;
    height: 22px;
    flex: 0 0 auto;
    margin: 0;
    cursor: grab;
  }

  .reel.mouth svg {
    filter: none;
    overflow: visible;
  }

  .mouth .lip {
    fill: none;
    stroke: var(--tape-edge);
    stroke-width: 2;
  }

  .mouth text {
    font: 500 8.5px var(--f-mono);
    fill: var(--muted);
  }

  .mouth .arr {
    fill: none;
    stroke: var(--muted);
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .tape.stack .tscroll {
    overflow: visible;
    position: relative;
    padding: 0;
  }

  .tape.stack.sel .tscroll {
    outline: 0;
  }

  .tape.stack.sel .well {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .well {
    width: 120px;
    margin-left: 6px;
    box-sizing: border-box;
    padding: 4px 5px 5px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    background: var(--tape);
    border: 2px solid var(--tape-edge);
    border-top: 0;
    border-radius: 0 0 10px 10px;
    box-shadow: 0 6px 10px -8px var(--shadow), inset 0 -3px 6px -4px var(--shadow);
  }

  .well .cells {
    display: flex;
    flex-direction: column;
    gap: 3px;
    background: none;
    border: 0;
    padding: 0;
    box-shadow: none;
  }

  .splate {
    height: 24px;
    display: grid;
    place-items: center;
    position: relative;
    border-radius: 4px;
    background: var(--cell);
    border: 1px solid var(--tape-edge);
    font-family: var(--f-mono);
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    box-shadow: 0 1px 0 var(--tape-edge);
  }

  .splate .ix {
    position: absolute;
    left: 5px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 9px;
    font-weight: 400;
    color: var(--muted);
  }

  .splate.top {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }

  .splate.w {
    background: var(--accent-soft);
  }

  .splate.more {
    height: 20px;
    font-size: 10.5px;
    font-weight: 500;
    color: var(--muted);
    background: none;
    border-style: dashed;
    box-shadow: none;
  }

  .splate.none {
    background: none;
    border: 0;
    box-shadow: none;
    font-size: 11px;
    font-weight: 400;
    color: var(--muted);
  }

  .tape.stack .heads {
    position: absolute;
    left: 134px;
    top: 4px;
    height: auto;
  }

  .tape.stack .head {
    position: absolute;
    left: 0;
    width: auto;
    flex-direction: row;
    align-items: center;
    gap: 2px;
    transition: top .12s ease;
  }

  .tape.stack .head::before {
    border: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-right: 7px solid var(--mc);
  }

  .grip {
    position: absolute;
    right: -8px;
    top: 18px;
    width: 12px;
    height: 34px;
    cursor: ew-resize;
    touch-action: none;
    border-radius: 4px;
    border: 1px solid var(--tape-edge);
    background: var(--tape);
    opacity: 0;
    transition: opacity .15s;
  }

  .tape:hover .grip,
  .grip:focus-visible {
    opacity: 1;
  }

  @media (hover: none) {
    .grip {
      opacity: 1;
    }
  }

  @media (prefers-reduced-motion: reduce) {

    .head,
    .reel .spokes {
      transition: none;
    }

    .led.waiting {
      animation: none;
    }
  }

  /* ---- floating panels ---- */
  .float {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 16px 38px -18px var(--shadow);
  }

  .guide {
    left: max(14px, env(safe-area-inset-left, 0px));
    bottom: 14px;
    width: min(400px, calc(100% - 28px));
    padding: 11px 36px 12px 14px;
  }

  .guide h3 {
    margin: 0 0 4px;
    font-family: var(--f-display);
    font-size: 15px;
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .guide p {
    margin: 0;
    font-size: 13px;
  }

  .guide .x {
    position: absolute;
    top: 8px;
    right: 8px;
  }

  .console {
    right: max(14px, env(safe-area-inset-right, 0px));
    bottom: 14px;
    width: min(360px, calc(100% - 28px));
  }

  .console .ch {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px 7px 12px;
    cursor: pointer;
  }

  .console .ch .ib {
    margin-left: auto;
  }

  .console .cb {
    padding: 0 12px 10px;
  }

  .stack {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px;
    font-family: var(--f-mono);
    font-size: 12px;
    min-width: 0;
  }

  .frame {
    border: 1px solid var(--mc);
    color: var(--mc);
    border-radius: 4px;
    padding: 0 6px;
  }

  .frame.top {
    background: var(--mc);
    color: var(--surface-2);
  }

  .frame.guest {
    border-style: dashed;
  }

  .diagwrap {
    overflow-x: auto;
  }

  table.diag {
    border-collapse: collapse;
    font-family: var(--f-mono);
    font-size: 12px;
  }

  table.diag th,
  table.diag td {
    padding: 3px 7px;
    text-align: center;
    border: 1px solid var(--line-soft);
    white-space: nowrap;
  }

  table.diag thead th {
    font-weight: 600;
    color: var(--muted);
  }

  table.diag tbody th {
    text-align: right;
    font-weight: 600;
  }

  table.diag td.A {
    color: var(--ok, #2f7d4f);
  }

  table.diag td.R {
    color: var(--bad, #b3261e);
  }

  table.diag td.L {
    color: var(--muted);
  }

  table.diag td.dg {
    outline: 2px solid var(--mc, var(--accent));
    outline-offset: -2px;
    font-weight: 700;
  }

  table.diag tr.me th,
  table.diag tr.me td {
    background: var(--surface);
  }

  table.diag tr.flip th,
  table.diag tr.flip td {
    border-top: 2px solid var(--line);
    font-style: italic;
  }

  .log {
    margin-top: 6px;
    font-family: var(--f-mono);
    font-size: 11.5px;
    color: var(--muted);
    max-height: 150px;
    overflow-y: auto;
    display: flex;
    flex-direction: column-reverse;
  }

  .log div span {
    color: var(--ink);
    opacity: .55;
    margin-right: 6px;
    display: inline-block;
    min-width: 4ch;
    text-align: right;
  }

  .result {
    font-size: 12.5px;
    margin-top: 6px;
  }

  /* ---- windows ---- */
  .win {
    position: absolute;
    width: 450px;
    max-width: calc(100% - 16px);
    max-height: calc(100% - 16px);
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 24px 50px -20px var(--shadow), 0 2px 6px -3px var(--shadow);
    overflow: hidden;
  }

  .wtitle {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 8px 8px 12px;
    border-bottom: 1px solid var(--line-soft);
    cursor: grab;
    touch-action: none;
    user-select: none;
    background: var(--surface-2);
    border-top: 4px solid var(--mc, var(--tape-edge));
  }

  .wtitle b {
    font-family: var(--f-mono);
    font-size: 14px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }

  .wtabs {
    display: flex;
    gap: 2px;
    padding: 0 10px;
    border-bottom: 1px solid var(--line-soft);
    background: var(--surface-2);
  }

  .wtabs button {
    border: 0;
    background: none;
    padding: 7px 10px;
    font-weight: 500;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    font-size: 13px;
  }

  .wtabs button.on {
    color: var(--ink);
    border-bottom-color: var(--accent);
  }

  .wbody {
    overflow: auto;
    padding: 12px 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
  }

  .wbody>* {
    flex-shrink: 0;
  }

  .wbody>.field {
    flex: 0 0 auto;
  }

  .sec {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .sec>.field {
    flex: none;
  }

  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
    flex: 1 1 140px;
  }

  .field input,
  .field select,
  .inp {
    border: 1px solid var(--line);
    background: var(--surface-2);
    border-radius: 6px;
    padding: 5px 8px;
    font-family: var(--f-mono);
    font-size: 13px;
    min-width: 0;
    width: 100%;
  }

  .check {
    display: flex;
    align-items: center;
    gap: 6px;

    color: #fff8e6;
    text-shadow: 0 -1px 0 rgba(0, 0, 0, .35);
    background: radial-gradient(circle at 36% 28%, var(--hue-hi) 0 6%, var(--hue) 50%, color-mix(in srgb, var(--hue) 55%, #000) 100%);
    box-shadow: 0 4px 0 color-mix(in srgb, var(--hue) 45%, #000), inset 0 -4px 6px rgba(0, 0, 0, .3), 0 0 0 2px rgba(0, 0, 0, .35);
    transform: translateY(-3px);
    transition: transform .06s, box-shadow .06s;
  }

  .c-white .cap {
    color: #5b4a2c;
    text-shadow: 0 1px 0 #fff;
  }

  .pushbtn:active:not(:disabled) .cap {
    transform: translateY(0);
    box-shadow: 0 1px 0 color-mix(in srgb, var(--hue) 45%, #000), inset 0 -2px 5px rgba(0, 0, 0, .35), 0 0 0 2px rgba(0, 0, 0, .35);
  }

  .pushbtn:disabled {
    cursor: not-allowed;
  }

  .pushbtn:focus-visible,
  .toggle:focus-visible,
  .typekey:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  /* toggle switch: a bat handle on a round brass escutcheon */
  .toggle {
    width: 70px;
    height: 70px;
    border: 0;
    padding: 0;
    border-radius: 50%;
    position: relative;
    cursor: pointer;
    background: none;
  }

  .toggle .plate {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, transparent 0 46%, rgba(0, 0, 0, .18) 47% 48%, transparent 49%), conic-gradient(from 200deg, var(--brass-lo), var(--brass-hi) 18%, var(--brass) 40%, var(--brass-lo) 60%, var(--brass-hi) 80%, var(--brass-lo));
    box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .25), inset 0 2px 2px rgba(255, 255, 255, .35);
  }

  .toggle em {
    position: absolute;
    left: 0;
    right: 0;
    text-align: center;
    font: 700 8px/1 Georgia, serif;
    letter-spacing: .14em;
    color: #4a3612;
    font-style: normal;
    text-shadow: 0 1px 0 rgba(255, 240, 200, .6);
  }

  .toggle .t-on {
    top: 7px;
  }

  .toggle .t-off {
    bottom: 7px;
  }

  .toggle .pivot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 16px;
    height: 16px;
    margin: -8px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #fff3cf, #9a7330 60%, #4b350f);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .5);
  }

  .toggle .bat {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 9px;
    height: 26px;
    margin-left: -4.5px;
    transform-origin: 50% 0;
    transform: rotate(0deg);
    transition: transform .15s;
    border-radius: 3px 3px 5px 5px;
    background: linear-gradient(90deg, #8e8a82, #f6f3ec 45%, #a9a49a);
    box-shadow: 0 3px 4px rgba(0, 0, 0, .4);
  }

  .toggle .bat::after {
    content: "";
    position: absolute;
    left: -2px;
    bottom: -4px;
    width: 13px;
    height: 9px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #ffffff, #b9b3a7 70%);
  }

  .toggle.on .bat {
    transform: rotate(180deg);
  }

  .toggle:disabled {
    cursor: not-allowed;
  }

  /* entry: a paper slip in a typewriter, and a round typewriter key */
  .carriage {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .slip {
    height: 34px;
    width: 150px;
    padding: 0 10px;
    border: 0;
    border-radius: 1px;
    font: 600 17px/1 'Courier New', Courier, var(--f-mono);
    color: #2b2418;
    letter-spacing: .04em;
    background: linear-gradient(180deg, #fffaf0, #f3ead6);
    box-shadow: 0 0 0 1px var(--tape-edge), 0 3px 0 -1px #d9cba8, 0 6px 0 -2px #e8dcc0;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 96% 92%, 92% 100%, 88% 92%, 84% 100%, 80% 92%, 76% 100%, 72% 92%, 68% 100%, 64% 92%, 60% 100%, 56% 92%, 52% 100%, 48% 92%, 44% 100%, 40% 92%, 36% 100%, 32% 92%, 28% 100%, 24% 92%, 20% 100%, 16% 92%, 12% 100%, 8% 92%, 4% 100%, 0 92%);
  }

  .slip.num {
    width: 110px;
    text-align: right;
    -moz-appearance: textfield;
    appearance: textfield;
  }

  .slip.num::-webkit-inner-spin-button,
  .slip.num::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .slip::placeholder {
    color: #b3a684;
  }

  .slip:focus {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .typekey {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 0;
    padding: 3px;
    cursor: pointer;
    background: linear-gradient(160deg, #f7f7f2, #8f8f88 55%, #4a4a45);
    box-shadow: 0 3px 4px rgba(0, 0, 0, .35);
  }

  .typekey span {
    display: grid;
    place-items: center;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    font: 700 15px/1 Georgia, serif;
    color: #f4efe2;
    background: radial-gradient(circle at 40% 30%, #4a4a4a, #111 75%);
    box-shadow: inset 0 2px 2px rgba(255, 255, 255, .18), inset 0 -2px 3px rgba(0, 0, 0, .6);
    transform: translateY(-2px);
    transition: transform .06s;
  }

  .typekey:active:not(:disabled) span {
    transform: translateY(0);
  }

  .typekey:disabled {
    cursor: not-allowed;
  }

  /* lamps: faceted jewels in brass bezels */
  .lamps {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    max-width: 300px;
  }

  .jewel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }

  .jewel i {
    display: block;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    padding: 4px;
    position: relative;
    background: conic-gradient(from 200deg, var(--brass-lo), var(--brass-hi) 20%, var(--brass) 45%, var(--brass-lo) 65%, var(--brass-hi) 85%, var(--brass-lo));
  }

  .jewel i::after {
    content: "";
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(255, 255, 255, .08), rgba(0, 0, 0, .18), rgba(255, 255, 255, .08), rgba(0, 0, 0, .18), rgba(255, 255, 255, .08), rgba(0, 0, 0, .18), rgba(255, 255, 255, .08)), radial-gradient(circle at 40% 35%, color-mix(in srgb, var(--hue) 45%, #2a2420), color-mix(in srgb, var(--hue) 22%, #0d0b09) 80%);
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, .7);
  }

  .jewel.on i::after {
    background: conic-gradient(from 0deg, rgba(255, 255, 255, .18), rgba(0, 0, 0, .08), rgba(255, 255, 255, .18), rgba(0, 0, 0, .08), rgba(255, 255, 255, .18), rgba(0, 0, 0, .08), rgba(255, 255, 255, .18)), radial-gradient(circle at 40% 35%, #fff 0 10%, var(--hue-hi) 30%, var(--hue) 80%);
    box-shadow: 0 0 12px 4px var(--glow), 0 0 26px 6px color-mix(in srgb, var(--glow) 40%, transparent);
  }

  .jewel em {
    font: 600 9px/1 var(--f-mono);
    color: var(--muted);
    font-style: normal;
  }

  /* digits: Nixie tubes */
  .nixies {
    display: flex;
    gap: 4px;
    padding: 0 6px 8px;
    border-radius: 0 0 10px 10px;
    background: linear-gradient(180deg, transparent 0 calc(100% - 12px), #3b2a14 calc(100% - 12px), #6a4c22);
  }

  .tube {
    width: 34px;
    height: 58px;
    border-radius: 17px 17px 6px 6px;
    position: relative;
    overflow: hidden;
    display: grid;
    place-items: center;
    background: radial-gradient(ellipse at 50% 40%, rgba(255, 140, 60, .06), rgba(20, 12, 8, .92) 70%), #120c08;
    box-shadow: inset 0 0 0 1.5px rgba(255, 230, 190, .25), inset 3px 0 6px rgba(255, 255, 255, .08);
  }

  .tube::after {
    content: "";
    position: absolute;
    left: 5px;
    top: 6px;
    width: 6px;
    height: 36px;
    border-radius: 3px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .28), transparent);
  }

  .tube .mesh {
    position: absolute;
    inset: 6px 5px 8px;
    background: repeating-linear-gradient(60deg, rgba(160, 150, 140, .16) 0 1px, transparent 1px 4px), repeating-linear-gradient(-60deg, rgba(160, 150, 140, .16) 0 1px, transparent 1px 4px);
  }

  .tube b {
    position: relative;
    font: 300 34px/1 'Courier New', Courier, var(--f-mono);
    color: rgba(255, 170, 90, .12);
  }

  .tube b.lit {
    color: #ffb36b;
    text-shadow: 0 0 4px #ff7a1a, 0 0 10px #ff6a00, 0 0 18px rgba(255, 90, 0, .6);
  }

  /* number: a mechanical odometer in a brass housing */
  .odometer {
    display: flex;
    gap: 2px;
    padding: 6px 8px;
    border-radius: 20px;
    background: conic-gradient(from 200deg, var(--brass-lo), var(--brass-hi) 20%, var(--brass) 45%, var(--brass-lo) 65%, var(--brass-hi) 85%, var(--brass-lo));
    box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .25);
  }

  .drum {
    width: 22px;
    height: 34px;
    display: grid;
    place-items: center;
    font: 700 20px/1 'Courier New', Courier, var(--f-mono);
    color: #f6f1e2;
    background: linear-gradient(180deg, #050505, #2c2a27 30%, #3b3833 50%, #2c2a27 70%, #050505);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .6);
  }

  .drum:first-child {
    border-radius: 12px 0 0 12px;
  }

  .drum:last-child {
    border-radius: 0 12px 12px 0;
    color: #fff;
    background: linear-gradient(180deg, #3a0606, #8a1d14 30%, #a3261b 50%, #8a1d14 70%, #3a0606);
  }

  /* text: teleprinter ticker tape */
  .ticker {
    min-width: 160px;
    max-width: 320px;
    background: var(--tape);
    box-shadow: 0 0 0 1px var(--tape-edge);
    clip-path: polygon(0 0, 100% 0, 97% 25%, 100% 50%, 97% 75%, 100% 100%, 0 100%, 3% 75%, 0 50%, 3% 25%);
    padding: 0 14px 5px;
  }

  .ticker .holes {
    height: 8px;
    background: radial-gradient(circle, var(--hole) 0 1.6px, transparent 2px) 0 50% / 10px 8px repeat-x;
  }

  .ticker .typed {
    font: 600 17px/1.3 'Courier New', Courier, var(--f-mono);
    color: var(--ink);
    letter-spacing: .05em;
    word-break: break-all;
  }

  /* pixels: an LED matrix in its own black frame */
  .ledpanel {
    padding: 8px;
    border: 4px solid #2a2e34;
    border-radius: 6px;
    background: #0c0e10;
    box-shadow: inset 0 0 0 1px #000;
  }

  .pix {
    display: grid;
    gap: 3px;
  }

  .pix i {
    aspect-ratio: 1;
    border-radius: 50%;
    background: color-mix(in srgb, var(--hue) 14%, #15191c);
  }

  .pix i.on {
    background: radial-gradient(circle at 40% 35%, var(--hue-hi), var(--hue) 70%);
    box-shadow: 0 0 5px 1px color-mix(in srgb, var(--glow) 70%, transparent);
  }

  /* clock: an enamel dial in a brass bezel, with a winding crown that starts and stops it */
  .clockdev {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .clockdev .face {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    position: relative;
    padding: 6px;
    background: conic-gradient(from 200deg, var(--brass-lo), var(--brass-hi) 18%, var(--brass) 40%, var(--brass-lo) 60%, var(--brass-hi) 80%, var(--brass-lo));
    box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .25), inset 0 2px 2px rgba(255, 255, 255, .35);
  }

  .clockdev .face::before {
    content: "";
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    background: radial-gradient(circle, #fffaf0 0 58%, transparent 59%), repeating-conic-gradient(from -1.5deg, #2b2418 0 3deg, #f6eedb 3deg 30deg);
    box-shadow: inset 0 1px 4px rgba(0, 0, 0, .35);
  }

  .clockdev .hand {
    position: absolute;
    left: 50%;
    top: 50%;
    z-index: 1;
    width: 3px;
    height: 24px;
    margin: -22px 0 0 -1.5px;
    transform-origin: 50% 22px;
    border-radius: 2px;
    background: #1d1912;
    transition: transform .25s cubic-bezier(.3, 1.6, .6, 1);
  }

  .clockdev .hand::after {
    content: "";
    position: absolute;
    left: -2.5px;
    top: 2px;
    width: 8px;
    height: 8px;
    border-radius: 50% 50% 0 50%;
    transform: rotate(45deg);
    background: #1d1912;
  }

  .clockdev .hub {
    position: absolute;
    left: 50%;
    top: 50%;
    z-index: 2;
    width: 10px;
    height: 10px;
    margin: -5px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #fff3cf, #9a7330 60%, #4b350f);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .5);
  }

  .dev.k-clock.running .hub {
    background: radial-gradient(circle at 38% 32%, #ffd2c8, #c9332b 60%, #5a120e);
  }

  .dev.k-clock.beat .hub {
    animation: beat .35s ease-out;
  }

  @keyframes beat {
    30% {
      box-shadow: 0 0 0 4px rgba(201, 51, 43, .35), 0 0 10px 3px rgba(255, 90, 60, .6);
    }
  }

  .dev.k-clock.waiting .face {
    filter: brightness(.75) saturate(.6);
  }

  .clockside {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .crown {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 0;
    padding: 3px;
    cursor: pointer;
    background: repeating-conic-gradient(var(--brass-lo) 0 10deg, var(--brass-hi) 10deg 20deg);
    box-shadow: 0 3px 4px rgba(0, 0, 0, .35);
  }

  .crown span {
    display: grid;
    place-items: center;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    font: 700 11px/1 Georgia, serif;
    color: #4a3612;
    background: radial-gradient(circle at 40% 30%, var(--brass-hi), var(--brass) 70%);
  }

  .crown[aria-pressed="true"] span {
    color: #8f1d14;
  }

  .crown:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .every {
    font: 600 11px/1 var(--f-mono);
    color: var(--muted);
  }

  body.flatdev .clockdev .face {
    width: 52px;
    height: 52px;
    padding: 0;
    background: var(--surface);
    box-shadow: inset 0 0 0 2px var(--line);
  }

  body.flatdev .clockdev .face::before {
    inset: 3px;
    background: radial-gradient(circle, var(--surface) 0 74%, transparent 75%), repeating-conic-gradient(from -3deg, var(--muted) 0 6deg, var(--surface) 6deg 90deg);
    box-shadow: none;
  }

  body.flatdev .clockdev .hand {
    height: 18px;
    margin-top: -16px;
    transform-origin: 50% 16px;
    background: var(--ink);
  }

  body.flatdev .clockdev .hand::after {
    display: none;
  }

  body.flatdev .clockdev .hub {
    width: 8px;
    height: 8px;
    margin: -4px;
    background: var(--ink);
    box-shadow: none;
  }

  body.flatdev .dev.k-clock.running .hub {
    background: var(--bad, #c9332b);
  }

  body.flatdev .crown {
    width: 34px;
    height: 30px;
    border-radius: 6px;
    padding: 0;
    background: var(--accent);
    box-shadow: none;
  }

  body.flatdev .crown span {
    border-radius: 6px;
    background: none;
    color: var(--accent-ink);
    font: 600 11px/1 var(--f-mono);
  }

  body.flatdev .crown[aria-pressed="true"] span {
    color: var(--accent-ink);
  }

  /* aluminium and glass look: machined metal, soft-touch keys, LED rings and OLED glass, free-standing */
  body.aludev .dev {
    --alu-lo: #8b929a;
    --alu: #cfd4d9;
    --alu-hi: #f7f8fa;
    --oled: #0a0d11;
    --oled-ink: #dff3ff;
    --oled-glow: rgba(120, 200, 255, .55);
    --brushed: conic-gradient(from 30deg, var(--alu), var(--alu-hi) 8%, var(--alu) 16%, var(--alu-lo) 25%, var(--alu) 33%, var(--alu-hi) 50%, var(--alu) 58%, var(--alu-lo) 75%, var(--alu) 83%, var(--alu-hi) 92%, var(--alu));
  }

  body.aludev .devbody {
    filter: drop-shadow(0 3px 5px var(--shadow));
  }

  body.aludev .pushbtn {
    width: 64px;
    height: 64px;
    padding: 6px;
    background: var(--brushed);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .18), inset 0 1px 1px rgba(255, 255, 255, .8);
  }

  body.aludev .pushbtn .cap {
    font: 600 14px/1 system-ui, -apple-system, 'Segoe UI', sans-serif;
    letter-spacing: .02em;
    color: #fff;
    text-shadow: none;
    background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--hue) 85%, #fff), var(--hue) 60%, color-mix(in srgb, var(--hue) 80%, #000));
    box-shadow: 0 0 0 2px rgba(20, 24, 28, .75), inset 0 1px 1px rgba(255, 255, 255, .35), inset 0 -2px 4px rgba(0, 0, 0, .25);
    transform: none;
    transition: transform .06s, filter .06s;
  }

  body.aludev .c-white .cap {
    color: #2a3036;
    background: radial-gradient(circle at 50% 30%, #ffffff, #eceef0 60%, #cfd3d7);
  }

  body.aludev .pushbtn:active:not(:disabled) .cap {
    transform: scale(.94);
    filter: brightness(.94);
    box-shadow: 0 0 0 2px rgba(20, 24, 28, .75), inset 0 2px 4px rgba(0, 0, 0, .3);
  }

  /* switch: a latching key in a metal collar; its ring lights when the cell holds 1 */
  body.aludev .toggle {
    width: 64px;
    height: 64px;
  }

  body.aludev .toggle .plate {
    background: var(--brushed);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .18), inset 0 1px 1px rgba(255, 255, 255, .8);
  }

  body.aludev .toggle em,
  body.aludev .toggle .bat {
    display: none;
  }

  body.aludev .toggle .pivot {
    width: 40px;
    height: 40px;
    margin: -20px;
    background: radial-gradient(circle at 50% 30%, #3b4148, #1c2025 70%);
    box-shadow: 0 0 0 3px #1a1d21, 0 0 0 5px #3a4048, inset 0 1px 1px rgba(255, 255, 255, .15);
    transition: box-shadow .15s, transform .08s;
  }

  body.aludev .toggle.on .pivot {
    transform: scale(.95);
    box-shadow: 0 0 0 3px #1a1d21, 0 0 0 5px #45e08a, 0 0 10px 4px rgba(69, 224, 138, .55), inset 0 2px 3px rgba(0, 0, 0, .5);
  }

  /* entry: an OLED field behind glass, with a round metal enter key */
  body.aludev .slip {
    clip-path: none;
    height: 36px;
    border-radius: 18px;
    padding: 0 16px;
    font: 500 16px/1 var(--f-mono);
    letter-spacing: .04em;
    color: var(--oled-ink);
    text-shadow: 0 0 6px var(--oled-glow);
    background: linear-gradient(180deg, #161b21, var(--oled) 40%);
    box-shadow: 0 0 0 3px #2a2f35, 0 0 0 5px var(--alu), inset 0 1px 3px rgba(0, 0, 0, .8);
  }

  body.aludev .slip::placeholder {
    color: #4e5a66;
    text-shadow: none;
  }

  body.aludev .carriage {
    gap: 14px;
  }

  body.aludev .typekey {
    width: 42px;
    height: 42px;
    padding: 4px;
    background: var(--brushed);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .18), 0 2px 3px rgba(0, 0, 0, .25);
  }

  body.aludev .typekey span {
    font: 600 15px/1 system-ui, sans-serif;
    color: var(--oled-ink);
    background: radial-gradient(circle at 50% 30%, #3b4148, #1c2025 70%);
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, .15);
    transform: none;
  }

  body.aludev .typekey:active:not(:disabled) span {
    transform: scale(.93);
  }

  /* lamps: diffused LED domes in machined collars */
  body.aludev .jewel i {
    width: 26px;
    height: 26px;
    padding: 3px;
    background: var(--brushed);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .2);
  }

  body.aludev .jewel i::after {
    inset: 4px;
    background: radial-gradient(circle at 45% 35%, color-mix(in srgb, var(--hue) 30%, #3a3f45), color-mix(in srgb, var(--hue) 15%, #121518) 80%);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, .7);
  }

  body.aludev .jewel.on i::after {
    background: radial-gradient(circle at 45% 35%, #fff 0 12%, var(--hue-hi) 35%, var(--hue) 85%);
    box-shadow: 0 0 10px 3px var(--glow);
  }

  /* readouts: OLED glass in a metal-rimmed capsule */
  body.aludev .lcd {
    border-radius: 22px;
    padding: 9px 16px;
    background: linear-gradient(180deg, #161b21, var(--oled) 40%);
    box-shadow: 0 0 0 3px #2a2f35, 0 0 0 5px var(--alu), inset 0 1px 4px rgba(0, 0, 0, .8);
  }

  body.aludev .seg7 path {
    stroke: rgba(160, 215, 255, .07);
    stroke-width: 1.8;
  }

  body.aludev .seg7 path.on {
    stroke: var(--oled-ink);

<script>
  // ===== Turing World core engine (pure, no DOM) =====
  const BLANK = '_';

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  class TWError extends Error {
    constructor(msg, line) { super(line ? `line ${line}: ${msg}` : msg); this.line = line; }
  }

  // ---------- Budgets ----------
  function compileBudget(expr) {
    if (expr == null || String(expr).trim() === '') return null;
    const s = String(expr).trim();
    if (!/^[\sn0-9+\-*\/^().,a-z]*$/.test(s)) throw new TWError(`budget "${s}" may only use n, numbers, + - * / ^ ( ), log, sqrt, min, max`);
    const words = s.match(/[a-z]+/g) || [];

    try { f = new Function('n', 'L', `return (${js});`); f(4, x => Math.log2(Math.max(x, 2))); }

  // ---------- Program language ----------
  function tokenize(src) {
    const toks = []; let i = 0, line = 1;

    while (i < src.length) {

      if (c === '\n') { line++; i++; continue; }
      if (/\s/.test(c) || c === ';') { i++; continue; }

      if (c === "'") {
        if (src[i + 2] !== "'") throw new TWError(`quoted symbol must be one character, like '#'`, line);
        toks.push({ pos: i, t: 'sym', v: src[i + 1], line }); i += 3; continue;
      }
      if (c === '"') {
        let j = i + 1; while (j < src.length && src[j] !== '"' && src[j] !== '\n') j++;
        if (src[j] !== '"') throw new TWError('missing closing " in a string', line);
        const v = src.slice(i + 1, j);
        if (/[\s_]/.test(v)) throw new TWError('strings cannot contain spaces or blanks (_)', line);

      const tw = src.substr(i, 2);
      if (two.includes(tw)) { toks.push({ pos: i, t: 'op', v: tw, line }); i += 2; continue; }

      }
      if ('#$@*+-|&.%^/'.includes(c)) { toks.push({ pos: i, t: 'sym', v: c, line }); i++; continue; }
      throw new TWError(`unexpected character "${c}"`, line);

    toks.push({ pos: i, t: 'eof', v: '', line });

  const KEYWORDS = new Set(['while', 'if', 'else', 'write', 'move', 'inc', 'dec', 'call', 'accept', 'reject', 'tape', 'reg', 'machine', 'read', 'atstart', 'choose', 'guess', 'oracle', 'exists', 'forall', 'simulate', 'writeself', 'push', 'pop', 'send', 'seek']);

  function parseProgram(src) {

    const expectWord = v => { const t = next(); if (t.t !== 'word' || t.v !== v) throw new TWError(`expected "${v}" but found "${t.v || 'end'}"`, t.line); return t; };
    const ident = what => { const t = next(); if (t.t !== 'word' || !/^[A-Za-z_]/.test(t.v)) throw new TWError(`expected ${what} name but found "${t.v || 'end'}"`, t.line); return t.v; };

      const t = next();
      if (t.t === 'sym' || t.t === 'word') return t.v;

    const prog = { name: 'Program', dialect: null, tapes: [], regs: [], body: [], sockets: [] };

        case 'push': { next(); const tape = ident('tape'); return { k: 'push', tape, expr: parseExpr(), line: t.line }; }
        case 'pop': { next(); return { k: 'pop', tape: ident('tape'), line: t.line }; }
        case 'seek': { next(); const tape = ident('tape'); return { k: 'seek', tape, addr: parseExpr(), line: t.line }; }
        case 'send': { next(); const tape = ident('tape'); return { k: 'send', tape, expr: parseExpr(), line: t.line }; }
        case 'writeself': { next(); return { k: 'writestr', tape: ident('tape'), self: true, line: t.line }; }
        case 'simulate': {
          next(); const code = ident('tape'); let on = null, time = null, space = null;
          if (isWord('on')) {
            next(); expectOp('('); on = [];
            while (!isOp(')')) { on.push(ident('tape')); if (isOp(',')) next(); else if (!isOp(')')) throw new TWError('expected "," or ")" in the tape list', t.line); }

          next(); const tape = ident('tape'); const d = next();
          if (d.t !== 'word' || !['L', 'R', 'S'].includes(d.v)) throw new TWError('move direction must be L, R or S', d.line);
          return { k: 'move', tape, dir: d.v, line: t.line };
        }
        case 'inc': case 'dec': { next(); return { k: t.v, reg: ident('register'), line: t.line }; }
        case 'call': { next(); return { k: 'call', name: ident('machine'), line: t.line }; }

        }
        case 'guess': { next(); return { k: 'guess', reg: ident('register'), line: t.line }; }

          }
          return { k: 'halt', acc: t.v === 'accept', line: t.line };
        }
        case 'tape': case 'reg': case 'oracle': throw new TWError(`declare ${t.v}s at the top of the machine, before statements`, t.line);
        default: {
          next();
          if (isOp('=')) { next(); return { k: 'assign', reg: t.v, expr: parseExpr(), line: t.line }; }
          throw new TWError(`unknown statement "${t.v}"`, t.line);
        }

    }

    // declarations
    while (isWord('tape') || isWord('reg') || isWord('oracle')) {
      const t = next();
      if (t.v === 'oracle') {

        if (prog.sockets.includes(name)) throw new TWError(`oracle "${name}" declared twice`, t.line);
        prog.sockets.push(name);
      } else if (t.v === 'tape') {

    while (!isOp('}')) { if (peek().t === 'eof') throw new TWError('missing "}" at end of machine', peek().line); prog.body.push(parseStmt()); }
    next();
    if (peek().t !== 'eof') throw new TWError('text after the end of the machine', peek().line);
    return prog;
  }

  function compileProgram(src) {
    const prog = parseProgram(src);
    const tapeNames = new Set(prog.tapes.map(t => t.name));
    const regMap = new Map(prog.regs.map(r => [r.name, r]));
    regMap.set('ret', { name: 'ret', domain: ['none', 'accept', 'reject'], numeric: false, init: 'none', builtin: true });
    const usesCall = { v: false };
    const checkTape = (n, line) => { if (!tapeNames.has(n)) throw new TWError(`unknown tape "${n}"`, line); };
    const resolve = e => {
      if (e.k === 'read') { checkTape(e.tape, e.line); return e; }
      if (e.k === 'name') return regMap.has(e.v) ? { k: 'reg', name: e.v } : { k: 'lit', v: e.v };
      return e;
    };
    const resolveCond = c => {
      switch (c.k) {
        case 'or': case 'and': return { k: c.k, a: resolveCond(c.a), b: resolveCond(c.b) };
        case 'not': return { k: 'not', a: resolveCond(c.a) };
        case 'atstart': checkTape(c.tape, c.line); return c;
        case 'cmp': return { k: 'cmp', op: c.op, a: resolve(c.a), b: resolve(c.b) };
      }
    };
    const nodes = [];
    const mk = n => { n.id = nodes.length; nodes.push(n); return n; };
    const endNode = mk({ op: 'halt', acc: false, implicit: true, line: null });

        case 'seek': checkTape(s.tape, s.line); return mk({ op: 'seek', tape: s.tape, addr: s.addr.k === 'name' && tapeNames.has(s.addr.v) ? { k: 'tape', name: s.addr.v } : resolve(s.addr), line: s.line, next }).id;

        }

    if (prog.dialect === 'dfa') {
      if (prog.tapes.length !== 1) throw new TWError('a dfa machine has exactly one tape');
      const t = prog.tapes[0];
      if (!t.alphabet) throw new TWError('a dfa tape needs an alphabet, e.g. tape in : {0,1} readonly oneway', t.line);
      t.readonly = true; t.oneway = true;
      for (const n of nodes) {
        if (n.op === 'write' || n.op === 'writestr' || n.op === 'push' || n.op === 'pop' || n.op === 'send') throw new TWError('dfa machines cannot write', n.line);
        if (n.op === 'simulate') throw new TWError('dfa machines cannot simulate other machines', n.line);
        if (n.op === 'seek') throw new TWError('dfa machines cannot seek', n.line);
        if (n.op === 'call') throw new TWError('dfa machines cannot call other machines', n.line);
        if (n.op === 'choose') throw new TWError('dfa machines are deterministic (use an NFA for guessing)', n.line);
        if (n.op === 'move' && n.dir === 'L') throw new TWError('dfa heads only move right', n.line);
      }
      const walk = c => { if (!c) return; if (c.k === 'atstart') throw new TWError('atstart is not allowed in dfa machines', c.line); walk(c.a); walk(c.b); };

    let product = nodes.length;
    for (const r of regs) if (!r.builtin || usesCall.v) product *= r.domain.length;
    return {
      kind: 'prog', name: prog.name, dialect: prog.dialect, sockets: prog.sockets, nondet: nodes.some(n => n.op === 'choose'),
      ports: prog.tapes.map(t => ({ name: t.name, readonly: t.readonly, oneway: t.oneway, output: !!t.output, alphabet: t.alphabet })),
      regs, nodes, entry, productStates: product,
    };
  }

  // ---------- Table formats ----------
  function splitList(s) { return s.split(/[\s,]+/).filter(Boolean); }

  function compileAutomaton(src, kind) {

      if ((m = l.match(/^alphabet\s*:\s*(.*)$/))) { splitList(m[1]).forEach(a => alphabet.add(a)); return; }

        if (s === BLANK) throw new TWError('"_" is the end-of-input blank and cannot label a transition', line);

n(opt.length, 10); mask++) {\n      const drop = new Set(opt.filter((_, j) => mask >> j & 1));\n      const rhs = p.rhs.filter((_, i) => !drop.has(i));\n      if (rhs.length === p.rhs.length) add(p.lhs, rhs, prodStr(p));\n      else if (rhs.length) { add(p.lhs, rhs, `${prodStr({ lhs: p.lhs, rhs })}  (from ${prodStr(p)}, dropping symbols that derive \u03b5)`); derived++; }\n    }\n  }\n  // unit rules A \u2192 B that can loop back to A are replaced by what B derives\n  const unit = (a, b) => out.some(r => r.lhs === a && r.rhs.length === 1 && r.rhs[0] === b);\n  const reach = new Map(g.nts.map(a => [a, new Set()]));\n  for (let ch = true; ch;) { ch = false; for (const r of out) if (r.rhs.length === 1 && g.isNT(r.rhs[0])) for (const a of g.nts) if ((a === r.lhs || reach.get(a).has(r.lhs)) && !reach.get(a).has(r.rhs[0])) { reach.get(a).add(r.rhs[0]); ch = true; } }\n  const cyclic = g.nts.some(a => reach.get(a).has(a));\n  if (!cyclic) return { prods: out, derived, cyclic };\n  const res = []; const seen2 = new Set();\n  for (const a of g.nts) for (const b of [a, ...reach.get(a)]) for (const r of out) if (r.lhs === b && !(r.rhs.length === 1 && g.isNT(r.rhs[0]))) {\n    const k = a + '>' + r.rhs.join(''); if (seen2.has(k)) continue; seen2.add(k);\n    res.push({ lhs: a, rhs: r.rhs, label: b === a ? r.label : `${prodStr({ lhs: a, rhs: r.rhs })}  (through ${a} \u21d2* ${b})` });\n  }\n  return { prods: res, derived: derived + 1, cyclic };\n}\nfunction grammarPdaText(g) {\n  const L = ['# the standard PDA of the grammar: expand a nonterminal on top, or match a terminal', `alphabet: ${g.terms.join(' ')}`, 'start: start', 'accept: accept', `start, eps, eps -> loop, ${g.start}${GRAMMAR_BOTTOM}`];\n  for (const p of g.prods) L.push(`loop, eps, ${p.lhs} -> loop, ${p.rhs.length ? p.rhs.join('') : 'eps'}    # ${prodStr(p)}`);\n  for (const a of g.terms) L.push(`loop, ${a}, ${a} -> loop, eps`);\n  L.push(`loop, eps, ${GRAMMAR_BOTTOM} -> accept, eps`);\n  return L.join('\\n');\n}\n/
